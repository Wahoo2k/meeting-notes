name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests
      - name: Import check
        run: python -c "import meetnotes.app, meetnotes.probe, soundcard, uiautomation, faster_whisper, pystray; print('imports ok')"
      - name: Build probe
        run: pyinstaller --noconfirm --onedir --console --name MeetingNotesTest --collect-all soundcard --collect-all uiautomation run_probe.py
      - name: Build app
        run: pyinstaller --noconfirm --onedir --windowed --name MeetingNotes --collect-all soundcard --collect-all uiautomation --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime --collect-all av --hidden-import pystray._win32 run_app.py
      - name: Package
        shell: pwsh
        run: |
          Copy-Item CLAUDE_INSTRUCTIONS.md, README.md dist\MeetingNotes\
          Compress-Archive -Path dist\MeetingNotesTest -DestinationPath MeetingNotesTest.zip
          Compress-Archive -Path dist\MeetingNotes -DestinationPath MeetingNotes.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingNotesTest
          path: MeetingNotesTest.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingNotes
          path: MeetingNotes.zip
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            MeetingNotesTest.zip
            MeetingNotes.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
